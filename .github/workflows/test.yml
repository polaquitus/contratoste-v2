name: Contratos TA v2 — Test automatico

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # ── 1. Verificar error handlers ──────────────────────────────────────
      # Los handlers viven en src/js/*.js (código modularizado), no como texto
      # literal en index.html — buscar ahí directamente no matchea nada.
      - name: Verificar window.onerror presente
        run: |
          if grep -rq "window.onerror" index.html src/js/; then
            echo "✓ window.onerror encontrado"
          else
            echo "✗ FALTA window.onerror"
            exit 1
          fi

      - name: Verificar unhandledrejection presente
        run: |
          if grep -rq "unhandledrejection" index.html src/js/; then
            echo "✓ unhandledrejection encontrado"
          else
            echo "✗ FALTA unhandledrejection"
            exit 1
          fi

      # ── 2. Verificar estructura básica HTML ──────────────────────────────
      - name: Verificar estructura HTML basica
        run: |
          grep -q "<script" index.html && echo "✓ tag script presente" || (echo "✗ No se encontro tag script" && exit 1)
          grep -q "supabase" index.html && echo "✓ referencia a supabase presente" || echo "⚠ No se encontro referencia a supabase"

      # ── 3. Cache-busting: todo src/ referenciado tiene que llevar ?v= ─────
      # Sin ?v= el navegador sirve el archivo cacheado y el cambio no se ve.
      # vendor/ va sin ?v= a propósito (no cambia).
      - name: Verificar cache-busting de src/
        run: |
          FALTAN=$(grep -oE '(src|href)="src/[^"]*"' index.html \
                   | grep -v 'vendor/' | grep -v '?v=' || true)
          if [ -n "$FALTAN" ]; then
            echo "✗ Estos archivos de src/ se cargan SIN ?v= — el cambio no se va a ver:"
            echo "$FALTAN"
            exit 1
          fi
          echo "✓ todos los archivos de src/ llevan ?v="

      # ── 4. Setup Node + Playwright ───────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Instalar Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps

      # ── 5. Servir ESTE commit localmente ─────────────────────────────────
      # Antes el test navegaba a https://polaquitus.github.io/contratoste/ — la
      # producción de OTRO repo. Un push a una rama testeaba código ajeno y el
      # verde no significaba nada. Ahora se sirve el árbol de este commit.
      - name: Servir el repo en localhost:8080
        run: |
          nohup python3 -m http.server 8080 --directory . > /tmp/http.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8080/index.html -o /dev/null; then
              echo "✓ sirviendo este commit en http://localhost:8080/"
              exit 0
            fi
            sleep 0.5
          done
          echo "✗ el server local no respondió"; cat /tmp/http.log; exit 1

      # ── 6. Reglas de negocio: los NÚMEROS ────────────────────────────────
      # Lo único que agarra los bugs de esta app, que no rompen la pantalla:
      # un AVE contado dos veces o un Ko con la fórmula equivocada renderizan
      # perfecto. Cada caso corresponde a un bug real (ver REGRESIONES.md).
      # Corre ANTES del smoke: si un número está mal, no importa que navegue.
      - name: Verificar reglas de negocio
        env:
          BASE_URL: http://localhost:8080/
        run: node .github/scripts/reglas-negocio.js

      # ── 7. Smoke: la app carga y los módulos existen ─────────────────────
      - name: Cargar app y navegar módulos
        env:
          BASE_URL: http://localhost:8080/
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: node .github/scripts/smoke.js

      # ── 8. Upload screenshots ────────────────────────────────────────────
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshot-*.png
          if-no-files-found: ignore

      # ── 9. Resumen final ─────────────────────────────────────────────────
      - name: Resumen
        if: always()
        run: |
          echo ""
          echo "============================================"
          echo "  Contratos TA v2 — Test completado"
          echo "  Repo: polaquitus/contratoste-v2"
          echo "  Commit: ${{ github.sha }}"
          echo "  Rama: ${{ github.ref_name }}"
          echo "============================================"
